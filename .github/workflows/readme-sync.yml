name: README Sync

on:
  push:
    paths:
      - "README.md"
      - "README.ru.md"
      - "scripts/sync_readme_ru.py"
  pull_request:
    paths:
      - "README.md"
      - "README.ru.md"
      - "scripts/sync_readme_ru.py"

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README sync marker
        run: python3 scripts/sync_readme_ru.py --check
